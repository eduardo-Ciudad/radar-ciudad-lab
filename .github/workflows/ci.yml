name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testes e imagem
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: radarciudad_db
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radarciudad_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/radarciudad_db
      DB_USERNAME: radar
      DB_PASSWORD: radar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Credenciais de teste
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/ga-key.pem" 2>/dev/null
          python3 - <<'PY'
          import json, os
          tmp = os.environ["RUNNER_TEMP"]
          key = open(f"{tmp}/ga-key.pem").read()
          json.dump({
              "type": "service_account",
              "project_id": "radar-ci",
              "private_key_id": "ci",
              "private_key": key,
              "client_email": "ci@radar-ci.iam.gserviceaccount.com",
              "client_id": "0",
              "token_uri": "https://oauth2.googleapis.com/token"
          }, open(f"{tmp}/ga-fake.json", "w"))
          PY
          JWT_SECRET="$(openssl rand -base64 48)"
          echo "::add-mask::$JWT_SECRET"
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          echo "GA_CREDENTIALS_PATH=$RUNNER_TEMP/ga-fake.json" >> "$GITHUB_ENV"

      - name: Testes unitários e de integração
        run: ./mvnw -B -ntp verify

      - name: Relatórios dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

      - name: Build da imagem Docker
        run: docker build -t radar-api:ci .
