# Profile de produção (VPS). Ative com SPRING_PROFILES_ACTIVE=prod.
# Variáveis sem valor padrão são obrigatórias: se faltar alguma, a aplicação não sobe.

spring:
  datasource:
    url: ${DB_URL}
    hikari:
      maximum-pool-size: 5          # VPS pequena e poucos usuários; cada conexão custa memória no Postgres
  flyway:
    clean-disabled: true            # nunca permitir apagar o banco de produção com flyway clean
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful                # no redeploy, requisições e sync em andamento terminam antes de parar
  error:                            # erros fora do ApiExceptionHandler nunca expõem detalhe interno
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

radar:
  analytics:
    google:
      credentials-path: ${GA_CREDENTIALS_PATH}
  security:
    cors:
      # O navegador só fala com a Vercel; Vercel -> API é servidor a servidor (sem CORS).
      # Vazio = nenhuma página consegue chamar a API direto do navegador.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    client-key:
      required: true                # sem RADAR_CLIENT_KEY (32+ caracteres) a aplicação não sobe

logging:
  level:
    root: INFO
    com.eduar.radarciudadlab: INFO
